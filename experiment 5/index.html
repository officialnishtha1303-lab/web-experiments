
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Check current weather conditions for any city.">
    <title>Weather App | Nishtha Singh</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>

    <header class="header">
        <h1>Weather App</h1>
        <p>Real-time weather at your fingertips</p>
    </header>

    <main class="container">
        <section class="weather-card" aria-labelledby="page-title">
            <h2 id="page-title">Check City Weather</h2>

            <form id="weather-form">
                <label for="city-input">Enter city name</label>
                <div class="search-box">
                    <input
                        type="text"
                        id="city-input"
                        placeholder="e.g. Noida, Delhi, Mumbai"
                        autocomplete="off"
                        required
                    >
                    <button type="submit" id="search-btn">Search</button>
                </div>
            </form>

            <p id="status" role="status" aria-live="polite">
                Enter a city to see its current weather.
            </p>

            <section id="weather-result" class="weather-result" hidden
                     aria-label="Current weather">
                <h2 id="city-name"></h2>
                <p id="weather-icon" class="weather-icon" aria-hidden="true">☀️</p>
                <p id="condition" class="condition"></p>
                <p id="temperature" class="temperature"></p>
                <p id="feels-like"></p>

                <div class="details">
                    <article class="detail-box">
                        <span>Humidity</span>
                        <strong id="humidity">--</strong>
                    </article>

                    <article class="detail-box">
                        <span>Wind Speed</span>
                        <strong id="wind">--</strong>
                    </article>
                </div>

                <p id="updated-time" class="updated-time"></p>
            </section>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Nishtha Singh | Weather App Practical</p>
        <p>Weather data provided by Open-Meteo</p>
    </footer>

</body>
</html>
